<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Princessgram 👑</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 390px;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(255,150,180,0.2);
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #ffe4ef 0%, #ffd6e8 100%);
      border-bottom: 1px solid #ffc5db;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #d4548a, #e8a0bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      font-style: italic;
    }
    .header-icons {
      display: flex;
      gap: 16px;
      font-size: 20px;
      color: #c06090;
    }

    /* ── Stories ── */
    .stories {
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #ffe4ef;
      scrollbar-width: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .story-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(45deg, #f9a8d4, #ec4899, #db2777);
      padding: 2.5px;
    }
    .story-ring.mine {
      background: linear-gradient(45deg, #fbbf24, #f59e0b);
    }
    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: linear-gradient(135deg, #ffe4ef, #ffd6e8);
    }
    .story-name {
      font-size: 11px;
      color: #666;
      max-width: 66px;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Write Box ── */
    .write-box {
      margin: 16px;
      border: 1.5px solid #ffc5db;
      border-radius: 16px;
      overflow: hidden;
      background: #fff9fc;
    }
    .write-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 8px;
    }
    .write-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fda4af, #f43f5e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .write-name {
      font-weight: 600;
      font-size: 13px;
      color: #333;
    }
    .write-sub {
      font-size: 11px;
      color: #aaa;
    }
    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 0 14px 12px;
      font-size: 14px;
      color: #333;
      background: transparent;
      line-height: 1.6;
      min-height: 100px;
      font-family: inherit;
    }
    textarea::placeholder { color: #ccc; }
    .write-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-top: 1px solid #ffe4ef;
    }
    .write-emojis { font-size: 18px; display: flex; gap: 8px; }
    .post-btn {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 7px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .post-btn:hover { opacity: 0.85; }
    .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #ffe4ef;
      margin: 0 16px 4px;
    }

    /* ── Feed ── */
    .feed { flex: 1; padding: 8px 0 80px; }

    .post-card {
      margin-bottom: 20px;
    }

    .post-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
    }
    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: linear-gradient(135deg, #fda4af, #f43f5e);
      flex-shrink: 0;
    }
    .post-info { flex: 1; }
    .post-username { font-weight: 600; font-size: 13px; color: #222; }
    .post-time { font-size: 11px; color: #aaa; }

    .post-content {
      padding: 0 16px 12px;
      font-size: 14px;
      color: #333;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    /* castle placeholder */
    .post-image-placeholder {
      width: 100%;
      aspect-ratio: 1;
      background: linear-gradient(160deg, #ffdde8 0%, #ffb6c9 40%, #ff8fab 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
    }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px 6px;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(1.3); }
    .action-btn.liked { filter: none; }

    .likes-count {
      padding: 0 16px 4px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    /* ── Comments ── */
    .comments { padding: 0 16px 10px; }
    .comment {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .comment-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .comment-body { flex: 1; }
    .comment-name { font-weight: 600; font-size: 12px; color: #222; }
    .comment-text { font-size: 13px; color: #444; line-height: 1.5; }
    .comment-time { font-size: 10px; color: #bbb; margin-top: 2px; }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0 8px;
      color: #bbb;
      font-size: 12px;
      animation: fadeIn 0.3s ease;
    }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #f9a8d4;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    .post-border { border-bottom: 1px solid #ffe4ef; }

    /* Avatar images (profile pictures replace emoji) */
    .story-avatar { overflow: hidden; }
    .story-avatar img,
    .post-avatar img,
    .comment-avatar img,
    .write-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .post-avatar, .comment-avatar { overflow: hidden; }

    /* Post image carousel */
    .post-image-carousel {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      aspect-ratio: 1;
      background: #ffeef5;
    }
    .post-image-carousel::-webkit-scrollbar { display: none; }
    .post-image-carousel img {
      width: 100%;
      flex-shrink: 0;
      scroll-snap-align: start;
      object-fit: cover;
      aspect-ratio: 1;
    }
    .post-image-dots {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 6px 0 2px;
    }
    .post-image-dots span {
      width: 5px; height: 5px; border-radius: 50%;
      background: #f9a8d4; opacity: 0.4;
    }
    .post-image-dots span.active { opacity: 1; background: #ec4899; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      background: rgba(255,255,255,0.95);
      border-top: 1px solid #ffe4ef;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 16px;
      backdrop-filter: blur(10px);
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #daa;
    }
    .empty-state .icon { font-size: 50px; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-logo">Princessgram 👑</div>
    <div class="header-icons">
      <span>💌</span>
      <span>🔔</span>
    </div>
  </header>

  <!-- Stories -->
  <div class="stories" id="stories">
    <div class="story">
      <div class="story-ring mine">
        <div class="story-avatar">👸</div>
      </div>
      <span class="story-name">내 스토리</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <div class="story-avatar"><img src="assets/ruby_/ruby_profile/ruby.png" alt="ruby_"></div>
      </div>
      <span class="story-name">ruby_</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <div class="story-avatar"><img src="assets/lily_/lily_profile/lily.png" alt="lily_princess"></div>
      </div>
      <span class="story-name">lily_princess</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <div class="story-avatar"><img src="assets/sora_/sora_profile/sora.png" alt="sora_diary"></div>
      </div>
      <span class="story-name">sora_diary</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <div class="story-avatar"><img src="assets/momo_/momo_profile/momo.png" alt="momo__o"></div>
      </div>
      <span class="story-name">momo__o</span>
    </div>
    <div class="story">
      <div class="story-ring">
        <div class="story-avatar"><img src="assets/pearl_/pearl_profile/pearl.png" alt="pearl_diary"></div>
      </div>
      <span class="story-name">pearl_diary</span>
    </div>
  </div>

  <!-- Write Box -->
  <div class="write-box">
    <div class="write-header">
      <div class="write-avatar">👸</div>
      <div>
        <div class="write-name">princess_chae</div>
        <div class="write-sub">오늘 하루를 기록해봐 🌷</div>
      </div>
    </div>
    <textarea id="diaryInput" placeholder="오늘 어떤 하루였어? 공주님의 이야기를 들려줘 ✨" rows="4"></textarea>
    <div class="write-footer">
      <div class="write-emojis">
        <span>🌷</span><span>✨</span><span>🎀</span><span>💕</span>
      </div>
      <button class="post-btn" id="postBtn" onclick="publishPost()">게시하기</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Feed -->
  <div class="feed" id="feed">
    <div id="dynamicFeed"></div>

    <div class="empty-state" id="emptyHint">
      <div class="icon">🏰</div>
      <p>오늘 하루를 기록해봐 🌷<br>공주님들이 달려올 거야 👑</p>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-btn">🏠</button>
    <button class="nav-btn">🔍</button>
    <button class="nav-btn">➕</button>
    <button class="nav-btn">💌</button>
    <button class="nav-btn">👸</button>
  </nav>

</div>

<script>

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function detectMood(text) {
    if (/행복|좋았|기쁘|설레|신나|재밌|즐거|웃음|예쁘|멋지|만족|감사|고마|사랑|뿌듯/.test(text)) return 'happy';
    if (/슬프|힘들|울었|괴롭|외롭|우울|속상|아프|힘겨|모르겠|지쳐|눈물|무서|걱정/.test(text)) return 'sad';
    if (/피곤|졸리|쉬고|힘없|나른|무기력|지쳤|녹초|빡세/.test(text)) return 'tired';
    return 'normal';
  }

  // 일기에서 핵심 명사/표현을 추출해 댓글에 직접 언급
  function extractKeyword(text) {
    // 특정 패턴 우선 추출
    const patterns = [
      /([가-힣]+(?:에|을|를|이|가|은|는)?\s?(?:갔|했|먹었|봤|만났|들었|읽었|걸었|느꼈|생각했|울었|웃었|힘들었|좋았|슬펐|피곤했|행복했))/,
      /([가-힣\s]{2,10}(?:이|가|은|는)\s?[가-힣\s]{2,8}(?:야|다|해|네|어|요))/,
      /([가-힣]{2,6}(?:에서|에서의|에서도|에서는))/,
    ];
    for (const p of patterns) {
      const m = text.match(p);
      if (m && m[1] && m[1].length > 2 && m[1].length < 20) return m[1].trim();
    }
    // fallback: 첫 문장의 핵심 부분
    const first = text.split(/[.。！!?？\n]/)[0].trim();
    if (first.length > 4 && first.length <= 25) return first;
    return text.slice(0, Math.min(text.length, 18)).trim();
  }

  function pickComment(char, mood, keyword) {
    const pool = char.templates[mood] || char.templates.normal;
    const fn = pool[Math.floor(Math.random() * pool.length)];
    return fn(keyword);
  }

  function timeAgo(seconds) {
    if (seconds < 60) return `방금 전`;
    const m = Math.floor(seconds / 60);
    if (m < 60) return `${m}분 전`;
    return `${Math.floor(m / 60)}시간 전`;
  }

  let postCount = 0;

  function publishPost() {
    const input = document.getElementById('diaryInput');
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById('postBtn');
    btn.disabled = true;
    btn.textContent = '게시 중...';

    const mood = detectMood(text);
    const keyword = extractKeyword(text);
    const now = new Date();
    const postId = 'post_' + (++postCount);
    const feed = document.getElementById('dynamicFeed');

    // 빈 상태 숨기기
    document.getElementById('emptyHint').style.display = 'none';

    // Build post card
    const card = document.createElement('div');
    card.className = 'post-card post-border';
    card.id = postId;

    const likes = rand(3, 48);
    card.innerHTML = `
      <div class="post-top">
        <div class="post-avatar">👸</div>
        <div class="post-info">
          <div class="post-username">princess_chae</div>
          <div class="post-time">방금 전</div>
        </div>
        <span style="color:#c06090;font-size:20px;">···</span>
      </div>
      <div class="post-content">${escHtml(text)}</div>
      <div class="post-actions">
        <button class="action-btn" onclick="toggleLike(this)">🤍</button>
        <button class="action-btn">💬</button>
        <button class="action-btn">📤</button>
        <span style="margin-left:auto;font-size:18px;">🔖</span>
      </div>
      <div class="likes-count" id="${postId}_likes">좋아요 ${likes}개</div>
      <div class="comments" id="${postId}_comments"></div>
    `;

    feed.insertBefore(card, feed.firstChild);
    input.value = '';
    btn.textContent = '게시하기';
    btn.disabled = false;

    // Schedule comments
    const shuffled = [...CHARACTERS].sort(() => Math.random() - 0.5);
    let accDelay = 0;

    shuffled.forEach((char, idx) => {
      const secDelay = char.delay();
      accDelay += secDelay * 1000;

      // Show typing indicator
      setTimeout(() => {
        showTyping(postId, char);
      }, accDelay - 800);

      // Show comment
      setTimeout(() => {
        removeTyping(postId);
        addComment(postId, char, pickComment(char, mood, keyword), accDelay / 1000);
      }, accDelay);
    });
  }

  function showTyping(postId, char) {
    removeTyping(postId);
    const container = document.getElementById(`${postId}_comments`);
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'typing-indicator';
    el.id = `${postId}_typing`;
    el.innerHTML = `
      <div class="comment-avatar" style="background:${char.bg};width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;"><img src="${char.profile}" alt="${char.id}" onerror="this.replaceWith(document.createTextNode('${char.emoji}'))"></div>
      <span style="font-size:12px;color:#bbb;">${char.id}</span>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    `;
    container.appendChild(el);
  }

  function removeTyping(postId) {
    const el = document.getElementById(`${postId}_typing`);
    if (el) el.remove();
  }

  function addComment(postId, char, text, elapsedSec) {
    const container = document.getElementById(`${postId}_comments`);
    if (!container) return;
    const el = document.createElement('div');
    el.className = 'comment';
    el.innerHTML = `
      <div class="comment-avatar" style="background:${char.bg}"><img src="${char.profile}" alt="${char.id}" onerror="this.replaceWith(document.createTextNode('${char.emoji}'))"></div>
      <div class="comment-body">
        <span class="comment-name">${char.id} </span>
        <span class="comment-text">${escHtml(text)}</span>
        <div class="comment-time">${timeAgo(Math.round(elapsedSec))}</div>
      </div>
    `;
    container.appendChild(el);
  }

  function toggleLike(btn) {
    if (btn.textContent === '🤍') {
      btn.textContent = '❤️';
      const card = btn.closest('.post-card');
      const likesEl = card.querySelector('.likes-count');
      const n = parseInt(likesEl.textContent.replace(/[^0-9]/g, ''));
      likesEl.textContent = `좋아요 ${n + 1}개`;
    } else {
      btn.textContent = '🤍';
      const card = btn.closest('.post-card');
      const likesEl = card.querySelector('.likes-count');
      const n = parseInt(likesEl.textContent.replace(/[^0-9]/g, ''));
      likesEl.textContent = `좋아요 ${Math.max(0, n - 1)}개`;
    }
  }

  function seedFeed() {
    const feed = document.getElementById('dynamicFeed');
    if (!feed) return;
    const byId = Object.fromEntries(CHARACTERS.map(c => [c.id, c]));
    // 정렬: hours 작은 것이 위로 (최근 게시글)
    const sorted = [...SEED_POSTS].sort((a,b) => a.hours - b.hours);

    sorted.forEach((p, idx) => {
      const char = byId[p.charId];
      if (!char) return;
      const card = document.createElement('div');
      card.className = 'post-card post-border';
      const seedId = 'seed_' + idx;
      const likes = rand(8, 320);
      const timeText = p.hours < 24 ? `${p.hours}시간 전` : `${Math.floor(p.hours/24)}일 전`;

      const imgs = p.files.map(f =>
        `<img src="assets/${p.folder}/${f}" alt="${char.id} post" loading="lazy">`

      const dots = p.files.length > 1
        ? `<div class="post-image-dots">${p.files.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join('')}</div>`

      card.innerHTML = `

      feed.appendChild(card);
    });

    if (sorted.length > 0) {
      const hint = document.getElementById('emptyHint');
      if (hint) hint.style.display = 'none';
    }

  document.addEventListener('DOMContentLoaded', () => {
    seedFeed();
    // 캐러셀 스크롤 → dots 동기화
    document.querySelectorAll('.post-image-carousel').forEach(car => {
      const dots = car.nextElementSibling;
      if (!dots || !dots.classList.contains('post-image-dots')) return;
      car.addEventListener('scroll', () => {
        const idx = Math.round(car.scrollLeft / car.clientWidth);
        dots.querySelectorAll('span').forEach((s,i) => s.classList.toggle('active', i===idx));
      });
    });
  });

  // Emoji quick insert
  document.querySelectorAll('.write-emojis span').forEach(span => {
    span.style.cursor = 'pointer';
    span.addEventListener('click', () => {
      const ta = document.getElementById('diaryInput');
      ta.value += span.textContent;
      ta.focus();
    });
  });
